<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>for u</title>
	<!-- <link rel="stylesheet" href="styleAwal.css"> -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Tilt+Neon&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<style>
	* {
		padding: 0;
		margin: 0;
		outline: 0;
	}

	.container {
		font-family: 'Tilt Neon', cursive;
		height: 100vh;
		width: 100vw;
		text-align: center;
		color: #000000;
		background: rgb(255, 255, 255);

	}

	.love,
	.yes,
	.no {
		padding-top: 15%;

	}



	h2 {
		font-size: 72px;
		margin-bottom: 20px;
	}

	a {
		font-size: 24px;
		text-decoration: none;
		padding: 5px 10px;
		margin-top: 20px;
		border: 3px solid #ddd;
		border-radius: 10px;
	}

	.love {
		padding-top: 15%;
		position: relative;
	}

	#no {
		position: absolute;
		transition: all 0.2s ease;
	}

	#yes {
		margin-left: 150px;
	}
</style>


<body>
	<div class="container">
		<div class="love">
			<h2>El cantiikkk,maafin aku ya kalo kesannya,aku marah sama kamu,tapi aslinyaa aku gamarah sama kamuu,ini buat
				kamuu sebagai bentuk permintaan maaf akuuu</h2>
			<a id="no" class="btn btn-dark">GA!</a>
			<a id="yes" href="yes.html" class="btn btn-dark">MAUUU</a>
		</div>
	</div>
	<script>
		const noBtn = document.getElementById("no");

		noBtn.addEventListener("mouseenter", () => {
			const maxX = window.innerWidth - noBtn.offsetWidth - 20;
			const maxY = window.innerHeight - noBtn.offsetHeight - 20;

			const randomX = Math.floor(Math.random() * maxX);
			const randomY = Math.floor(Math.random() * maxY);

			noBtn.style.left = randomX + "px";
			noBtn.style.top = randomY + "px";
		});
	</script>
</body>

</html>
